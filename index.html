<body>
<header>⚽ KickOff</header>

<div style="text-align:center;padding:15px">
  <button id="aktifkanNotif"
    style="background:#F1FF00;color:#101114;padding:12px 18px;border:0;border-radius:8px;font-weight:bold">
    🔔 Aktifkan Notifikasi
  </button>
  <p id="statusNotif" style="font-size:12px;color:#aaa">
    Aktifkan pemberitahuan KickOff
  </p>
</div>

<script>
document.getElementById("aktifkanNotif")
.addEventListener("click", async () => {
  const status = document.getElementById("statusNotif");

  if (!("Notification" in window)) {
    status.textContent = "Browser tidak mendukung notifikasi.";
    return;
  }

  const izin = await Notification.requestPermission();

  if (izin === "granted") {
    status.textContent = "Notifikasi berhasil diaktifkan!";

    const reg = await navigator.serviceWorker.ready;

    reg.showNotification("KickOff ⚽", {
      body: "Notifikasi KickOff berhasil diaktifkan!"
    });
  } else {
    status.textContent = "Izin notifikasi belum diberikan.";
  }
});
</script>
  
<nav>
<span>LIVE</span>
<span>HASIL</span>
<span>JADWAL</span>
<span>LIGA</span>
</nav>

<main>
<h3>Pertandingan</h3>
<div id="info">Mengambil data pertandingan...</div>
<div id="matches"></div>
</main>

<div class="bottom">
<span>🏠 Home</span>
<span>⚽ Matches</span>
<span>⭐ Favorit</span>
<span>⚙ Pengaturan</span>
</div>

<script>
const API =
"https://sportscore.com/api/widget/matches/?sport=football&limit=50";

async function updateMatches() {
  const container = document.getElementById("matches");
  const info = document.getElementById("info");

  try {
    const response = await fetch(API);

    if (!response.ok) {
      throw new Error("Gagal mengambil data");
    }

    const data = await response.json();
    const matches = data.matches || [];

    container.innerHTML = "";

    if (matches.length === 0) {
      container.innerHTML =
        '<div class="match">Belum ada pertandingan tersedia.</div>';
    }

    matches.forEach(match => {
      const status = match.status_text || match.status || "Pertandingan";
      const isLive = String(match.status).toLowerCase() === "live";

      const homeScore =
        match.home_score == null ? "-" : match.home_score;

      const awayScore =
        match.away_score == null ? "-" : match.away_score;

      const leagueName = match.competition || "Sepak Bola";

      const homeLogo = match.home_logo
        ? `<img src="${match.home_logo}" alt="">`
        : "";

      const awayLogo = match.away_logo
        ? `<img src="${match.away_logo}" alt="">`
        : "";

      const card = document.createElement("div");
      card.className = "league";

      const title = document.createElement("div");
      title.className = "league-title";
      title.textContent = "⚽ " + leagueName;

      const matchBox = document.createElement("div");
      matchBox.className = "match";

      const statusBox = document.createElement("div");
      statusBox.className = isLive ? "live" : "time";
      statusBox.textContent = isLive ? "● LIVE " + status : status;

      const home = document.createElement("div");
      home.className = "team";
      home.innerHTML =
        `<span class="team-name">${homeLogo}</span>`;
      home.querySelector(".team-name").append(
        document.createTextNode(match.home || "Tim kandang")
      );

      const homeScoreBox = document.createElement("span");
      homeScoreBox.className = "score";
      homeScoreBox.textContent = homeScore;
      home.append(homeScoreBox);

      const away = document.createElement("div");
      away.className = "team";
      away.innerHTML =
        `<span class="team-name">${awayLogo}</span>`;
      away.querySelector(".team-name").append(
        document.createTextNode(match.away || "Tim tandang")
      );

      const awayScoreBox = document.createElement("span");
      awayScoreBox.className = "score";
      awayScoreBox.textContent = awayScore;
      away.append(awayScoreBox);

      matchBox.append(statusBox, home, away);
      card.append(title, matchBox);
      container.append(card);
    });

    info.textContent =
      "Data diperbarui: " + new Date().toLocaleTimeString("id-ID");

  } catch (error) {
    info.textContent = "Data belum bisa dimuat. Periksa koneksi internet.";
  }
}

updateMatches();
setInterval(updateMatches, 60000);
</script>
